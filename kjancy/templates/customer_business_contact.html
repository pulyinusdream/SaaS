{% if business.contact_email or business.contact_phone %}<div class="customer-business-contact"><h3>Contact {{ business.name }}</h3>{% if business.contact_email %}<a href="mailto:{{ business.contact_email|urlencode }}">{{ icon('mail') }}{{ business.contact_email }}</a>{% endif %}{% if business.contact_phone %}<a href="tel:{{ business.contact_phone }}">{{ icon('phone') }}{{ business.contact_phone }}</a>{% endif %}</div>{% endif %}
